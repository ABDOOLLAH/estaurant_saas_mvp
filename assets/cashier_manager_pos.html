<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة المطعم — Cashier Manager POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, addDoc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, query, where, orderBy, limit, onSnapshot, serverTimestamp, Timestamp, writeBatch, increment } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const fbConfig = {
  apiKey: 'AIzaSyC6ja9p82UAKnibW7PvdVcNvJYJ9WOtkMU',
  authDomain: 'watsapp-halat.firebaseapp.com',
  projectId: 'watsapp-halat',
  storageBucket: 'watsapp-halat.appspot.com',
  messagingSenderId: '115869567267',
  appId: '1:115869567267:web:88209505e63a2e80c3e496'
};

const app = initializeApp(fbConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const TENANT = 'demo_tenant';
const BRANCH = 'demo_branch';
const CURRENCY = '₺';

// ── helpers ────────────────────────────────────────────────────────────────
const tenantRef = () => doc(db, 'tenants', TENANT);
const col = (name) => collection(db, 'tenants', TENANT, name);
const branchCol = (name) => collection(db, 'tenants', TENANT, 'branches', BRANCH, name);
const ordersCol = () => collection(db, 'orders');
const n = (v) => isNaN(+v) ? 0 : +(+v);
const money = (v) => `${n(v).toLocaleString('ar-SA', {minimumFractionDigits:0,maximumFractionDigits:2})} ${CURRENCY}`;
const ts2str = (ts) => { if (!ts) return '—'; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleString('ar-SA'); };
const uid = () => Math.random().toString(36).slice(2,10).toUpperCase();
const ordNum = () => 'ORD-' + String(Date.now()).slice(-6);

async function logAction(action, details = {}) {
  const user = auth.currentUser;
  try {
    await addDoc(col('activity_logs'), {
      action, details,
      userId: user?.uid || null,
      userEmail: user?.email || null,
      createdAt: serverTimestamp()
    });
  } catch {}
}

function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
}

function confirm2(msg) {
  return new Promise(res => {
    const m = document.getElementById('confirm-modal');
    document.getElementById('confirm-msg').textContent = msg;
    m.style.display = 'flex';
    const yes = () => { m.style.display='none'; cleanup(); res(true); };
    const no = () => { m.style.display='none'; cleanup(); res(false); };
    const cleanup = () => { document.getElementById('confirm-yes').onclick = null; document.getElementById('confirm-no').onclick = null; };
    document.getElementById('confirm-yes').onclick = yes;
    document.getElementById('confirm-no').onclick = no;
  });
}

// ── State ────────────────────────────────────────────────────────────────
let currentPage = 'cashier';
let unsubListeners = [];
let activeLang = 'ar';

// POS state
const cart = [];
let posOrderType = 'dine-in';
let posTableId = null;
let posTableNum = null;
let posDiscount = 0;
let posNotes = '';
let posSelectedCategory = null;

// ── Auth ────────────────────────────────────────────────────────────────
onAuthStateChanged(auth, user => {
  if (user && !user.isAnonymous) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'flex';
    document.getElementById('user-name').textContent = user.email;
    navigateTo(currentPage);
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
  }
});

window.doLogin = async () => {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!email || !pass) return toast('أدخل البريد وكلمة المرور', 'error');
  document.getElementById('login-btn').disabled = true;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    logAction('login');
  } catch (e) {
    toast('بيانات الدخول غير صحيحة', 'error');
    document.getElementById('login-btn').disabled = false;
  }
};

window.doRegister = async () => {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!email || !pass) return toast('أدخل البريد وكلمة المرور', 'error');
  try {
    await createUserWithEmailAndPassword(auth, email, pass);
    toast('تم إنشاء الحساب وتسجيل الدخول', 'success');
  } catch (e) {
    toast('فشل إنشاء الحساب: ' + e.message, 'error');
  }
};

window.doLogout = async () => {
  if (await confirm2('هل تريد تسجيل الخروج؟')) {
    await signOut(auth);
  }
};

// ── Navigation ────────────────────────────────────────────────────────────
const pageLabels = {
  dashboard: 'لوحة التحكم', cashier: 'الكاشير', tables: 'الطاولات',
  orders: 'الطلبات', kitchen: 'المطبخ', products: 'المنتجات',
  modifiers: 'الإضافات', inventory: 'المخزون', purchases: 'المشتريات',
  suppliers: 'الموردين', expenses: 'المصاريف', shift: 'الوردية',
  reports: 'التقارير', settings: 'الإعدادات', logs: 'سجل العمليات'
};

window.navigateTo = (page) => {
  currentPage = page;
  unsubListeners.forEach(u => { try { u(); } catch {} });
  unsubListeners = [];
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  document.getElementById('page-title').textContent = pageLabels[page] || page;
  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
  setTimeout(() => renderPage(page), 50);
};

// ── Seed Data ─────────────────────────────────────────────────────────────
window.seedDemo = async () => {
  const btn = document.getElementById('seed-btn');
  btn.disabled = true; btn.textContent = 'جارٍ التجهيز...';
  try {
    const batch = writeBatch(db);
    batch.set(tenantRef(), { id: TENANT, name: 'مطعم تجريبي', currency: 'TRY', updatedAt: serverTimestamp() }, { merge: true });

    const cats = [['meals','وجبات',1],['drinks','مشروبات',2],['desserts','حلويات',3],['extras','إضافات',4]];

    const items = [

      ['fries','بطاطا محمرة','extras',50],['cola','كولا','drinks',30],
      ['juice','عصير طازج','drinks',45],['kunafa','كنافة','desserts',90],
      ['tea','شاي','drinks',20],['shawarma_meat','شاورما لحم','meals',160]
    ];
    for (const [id,name,cat,price] of items) {
      batch.set(doc(col('menu_items'), id), {id,name,categoryId:cat,price,isAvailable:true,isSoldOut:false,isVisible:true,tenantId:TENANT,createdAt:serverTimestamp()}, {merge:true});
    }

    for (let n=1;n<=8;n++) {
      const id = `table_${n}`;
      batch.set(doc(branchCol('tables'), id), {id,tenantId:TENANT,branchId:BRANCH,number:`${n}`,status:'available',isActive:true,qrCodeUrl:`${location.origin}/#/menu/${TENANT}/${BRANCH}/${id}`,lastStatusUpdate:serverTimestamp()}, {merge:true});
    }

    const invItems = [['chicken','دجاج','كغ',10,3,80],['meat','لحم','كغ',8,2,120],['bread','خبز','رغيف',50,10,5],['cola_stock','كولا','علبة',48,12,15]];
    for (const [id,name,unit,qty,min,price] of invItems) {

    batch.set(doc(col('suppliers'), 'sup1'), {id:'sup1',name:'مورد الدجاج والمواد',phone:'05001234567',address:'شارع السوق',notes:''}, {merge:true});

    await batch.commit();
    await logAction('seed_demo_data');
    toast('تم تجهيز البيانات التجريبية بنجاح ✓', 'success');
    navigateTo(currentPage);
  } catch(e) {
    toast('خطأ: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = '⚡ بيانات تجريبية';
  }

// ══════════════════════════════════════════════════════════════════════════
// PAGE RENDERERS
// ══════════════════════════════════════════════════════════════════════════

function renderPage(page) {
  const renderers = {
    dashboard: renderDashboard, cashier: renderCashier, tables: renderTables,
    orders: renderOrders, kitchen: renderKitchen, products: renderProducts,
    modifiers: renderModifiers, inventory: renderInventory, purchases: renderPurchases,
    suppliers: renderSuppliers, expenses: renderExpenses, shift: renderShift,
    reports: renderReports, settings: renderSettings, logs: renderLogs
  };
  (renderers[page] || (() => { document.getElementById('main-content').innerHTML = '<p style="padding:2rem">قيد التطوير</p>'; }))();
}

// ─── DASHBOARD ─────────────────────────────────────────────────────────────
function renderDashboard() {
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="page-inner">
      <div class="stats-grid" id="dash-stats">
        ${statCard('مبيعات اليوم','—','icon-sales','amber')}
        ${statCard('عدد الطلبات','—','icon-orders','blue')}
        ${statCard('إجمالي الكاش','—','icon-cash','green')}
        ${statCard('إجمالي البطاقة','—','icon-card','purple')}
        ${statCard('المصاريف اليومية','—','icon-exp','red')}
        ${statCard('صافي الصندوق','—','icon-net','teal')}
        ${statCard('طلبات مفتوحة','—','icon-open','orange')}
        ${statCard('أكثر منتج مبيعًا','—','icon-top','pink')}
      </div>
      <div class="dash-actions">
        <button class="btn btn-primary btn-lg" onclick="navigateTo('cashier')">🖥️ فتح شاشة الكاشير</button>
        <button class="btn btn-outline btn-lg" onclick="navigateTo('orders')">📋 عرض الطلبات</button>
        <button class="btn btn-outline btn-lg" onclick="navigateTo('reports')">📊 تقرير اليوم</button>
        <button class="btn btn-outline btn-lg" onclick="navigateTo('shift')">💼 الوردية</button>
      </div>
      <div class="low-stock-section" id="low-stock-section"></div>
    </div>`;

  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const unsub1 = onSnapshot(query(ordersCol(), where('tenantId','==',TENANT), where('createdAt','>=',Timestamp.fromDate(todayStart))), snap => {
    const orders = snap.docs.map(d => d.data());
    const paid = orders.filter(o => o.status==='paid'||o.isPaid===true);
    const sales = paid.reduce((s,o)=>s+n(o.totalAmount||o.total),0);
    const cash = paid.filter(o=>(o.paymentMethod||'').includes('cash')).reduce((s,o)=>s+n(o.totalAmount),0);
    const card = paid.filter(o=>(o.paymentMethod||'').includes('card')).reduce((s,o)=>s+n(o.totalAmount),0);
    const openOrders = orders.filter(o=>!['paid','cancelled','refunded'].includes(o.status)).length;

    // top product
    const itemCount = {};
    paid.forEach(o => (o.items||[]).forEach(it => { itemCount[it.productName] = (itemCount[it.productName]||0) + n(it.quantity); }));
    const topProduct = Object.entries(itemCount).sort((a,b)=>b[1]-a[1])[0];

    updateStat('icon-sales', money(sales));
    updateStat('icon-orders', `${orders.length}`);
    updateStat('icon-cash', money(cash));
    updateStat('icon-card', money(card));
    updateStat('icon-open', `${openOrders}`);
    updateStat('icon-top', topProduct ? topProduct[0] : '—');
  });

  const unsub2 = onSnapshot(query(col('expenses'), where('createdAt','>=',Timestamp.fromDate(todayStart))), snap => {
    const expTotal = snap.docs.reduce((s,d)=>s+n(d.data().amount),0);
    updateStat('icon-exp', money(expTotal));
  });

  const unsub3 = onSnapshot(col('inventory_items'), snap => {
    const low = snap.docs.map(d=>d.data()).filter(i => n(i.quantity) <= n(i.minQuantity));
    const sec = document.getElementById('low-stock-section');
    if (sec && low.length > 0) {
      sec.innerHTML = `<div class="alert alert-warning"><strong>⚠️ تنبيه مخزون منخفض:</strong> ${low.map(i=>`${i.name} (${i.quantity} ${i.unit})`).join(' • ')}</div>`;
    }
  });

  // calc net after expenses loaded
  unsubListeners.push(unsub1, unsub2, unsub3);
}

function updateStat(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}

function statCard(label, val, id, color) {
  return `<div class="stat-card stat-${color}"><div class="stat-label">${label}</div><div class="stat-value" id="${id}">${val}</div></div>`;
}

// ─── CASHIER / POS ─────────────────────────────────────────────────────────
function renderCashier() {
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="pos-layout">
      <div class="pos-categories" id="pos-categories"><div class="loading-spinner"><div class="spinner"></div></div></div>
      <div class="pos-products" id="pos-products"><div class="loading-spinner"><div class="spinner"></div></div></div>
      <div class="pos-ticket" id="pos-ticket"></div>
    </div>`;

  posSelectedCategory = null;
  loadPosCategories();
  loadPosProducts();
  renderTicket();
}

function loadPosCategories() {
  const unsub = onSnapshot(query(col('categories'), orderBy('displayOrder')), snap => {
    const div = document.getElementById('pos-categories');
    if (!div) return;
    const cats = snap.docs.map(d => ({...d.data(), id: d.id}));
    div.innerHTML = `
      <div class="cat-header">التصنيفات</div>
      <button class="cat-btn ${posSelectedCategory===null?'active':''}" onclick="selectCategory(null)">الكل</button>
      ${cats.map(c => `<button class="cat-btn ${posSelectedCategory===c.id?'active':''}" onclick="selectCategory('${c.id}')">${c.name}</button>`).join('')}`;
  });
  unsubListeners.push(unsub);
}

window.selectCategory = (id) => {
  posSelectedCategory = id;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  loadPosProducts();
};

function loadPosProducts() {
  const unsub = onSnapshot(col('menu_items'), snap => {
    const div = document.getElementById('pos-products');
    if (!div) return;
    let items = snap.docs.map(d=>({...d.data(),id:d.id})).filter(p=>p.isVisible!==false&&p.isAvailable!==false&&p.isSoldOut!==true);
    if (posSelectedCategory) items = items.filter(p => p.categoryId === posSelectedCategory);
    if (!items.length) { div.innerHTML = '<p class="empty-state">لا توجد منتجات في هذا التصنيف</p>'; return; }
    div.innerHTML = `<div class="products-grid">${items.map(p => `
      <button class="product-card" onclick='addToCart(${JSON.stringify({id:p.id,name:p.name,price:p.price})})'>
        <span class="product-icon">🍽️</span>
        <span class="product-name">${p.name}</span>
        <span class="product-price">${money(p.price)}</span>
      </button>`).join('')}</div>`;
  });
  unsubListeners.push(unsub);
}

window.addToCart = (item) => {
  const existing = cart.find(i => i.productId===item.id);
  if (existing) { existing.quantity++; }
  else { cart.push({ productId:item.id, productName:item.name, quantity:1, unitPrice:n(item.price), notes:'' }); }
  renderTicket();
};

window.updateCartQty = (idx, delta) => {
  if (cart[idx]) {
    cart[idx].quantity += delta;
    if (cart[idx].quantity <= 0) cart.splice(idx, 1);
  }
  renderTicket();
};

window.removeCartItem = (idx) => { cart.splice(idx, 1); renderTicket(); };

window.setOrderType = (type) => {
  posOrderType = type;
  document.querySelectorAll('.order-type-btn').forEach(b => b.classList.toggle('active', b.dataset.type===type));
  renderTicket();
};

function cartSubtotal() { return cart.reduce((s,i)=>s+n(i.unitPrice)*i.quantity,0); }
function cartTotal() { return Math.max(0, cartSubtotal() - n(posDiscount)); }

function renderTicket() {
  const div = document.getElementById('pos-ticket');
  if (!div) return;
  const subtotal = cartSubtotal();
  const total = cartTotal();

  let tableSelect = '';
  // We'll render table select only for dine-in
  if (posOrderType === 'dine-in') {
    // Will be populated by async call
    tableSelect = `<div id="table-select-wrapper"><select id="table-select" class="form-control" onchange="selectTable(this.value, this.options[this.selectedIndex].text)"><option value="">اختر الطاولة...</option></select></div>`;
    setTimeout(loadTableOptions, 0);
  }

  div.innerHTML = `
    <div class="ticket-header">
      <span class="ticket-title">🧾 الفاتورة الحالية</span>
      <button class="btn btn-sm btn-ghost" onclick="clearCart()" title="مسح السلة">✕</button>
    </div>
    <div class="order-types">
      <button class="order-type-btn ${posOrderType==='dine-in'?'active':''}" data-type="dine-in" onclick="setOrderType('dine-in')">داخل 🪑</button>
      <button class="order-type-btn ${posOrderType==='takeaway'?'active':''}" data-type="takeaway" onclick="setOrderType('takeaway')">سفري 🛍️</button>
      <button class="order-type-btn ${posOrderType==='delivery'?'active':''}" data-type="delivery" onclick="setOrderType('delivery')">توصيل 🛵</button>
    </div>
    ${tableSelect}
    <div class="cart-items" id="cart-items">
      ${cart.length===0 ? '<p class="empty-state">السلة فارغة — اختر منتجات من القائمة</p>' :
        cart.map((item,idx) => `
          <div class="cart-item">
            <div class="cart-item-info">
              <span class="cart-item-name">${item.productName}</span>
              <span class="cart-item-price">${money(item.unitPrice)}</span>
            </div>
            <div class="cart-item-controls">
              <button class="qty-btn" onclick="updateCartQty(${idx},-1)">−</button>
              <span class="qty-val">${item.quantity}</span>
              <button class="qty-btn" onclick="updateCartQty(${idx},1)">+</button>
              <button class="qty-btn btn-danger-ghost" onclick="removeCartItem(${idx})">🗑</button>
            </div>
            <div class="cart-item-total">${money(item.unitPrice * item.quantity)}</div>
          </div>`).join('')}
    </div>
    <div class="ticket-fields">
      <input class="form-control" placeholder="ملاحظة الطلب" value="${posNotes}" oninput="posNotes=this.value" />
      <input class="form-control" type="number" placeholder="خصم (₺)" value="${posDiscount||''}" oninput="posDiscount=+this.value||0; updateTotals()" />
    </div>
    <div class="ticket-totals">
      <div class="total-row"><span>المجموع الفرعي</span><span>${money(subtotal)}</span></div>
      <div class="total-row"><span>الخصم</span><span class="text-danger">- ${money(posDiscount)}</span></div>
      <div class="total-row total-final"><span>الإجمالي</span><span id="final-total">${money(total)}</span></div>
    </div>
    <div class="ticket-actions">
      <button class="btn btn-warning btn-block" onclick="sendToKitchen()">📤 إرسال للمطبخ</button>
      <div class="pay-btns">
        <button class="btn btn-success" onclick="processPayment('cash')">💵 كاش</button>
        <button class="btn btn-info" onclick="processPayment('card')">💳 بطاقة</button>
        <button class="btn btn-purple" onclick="processPayment('mixed')">🔀 مختلط</button>
      </div>
    </div>`;
}

window.updateTotals = () => {
  const el = document.getElementById('final-total');
  if (el) el.textContent = money(cartTotal());
};

window.clearCart = async () => {
  if (cart.length && !(await confirm2('هل تريد مسح السلة؟'))) return;
  cart.length = 0; posDiscount = 0; posNotes = ''; posTableId = null; posTableNum = null;
  renderTicket();
};

async function loadTableOptions() {
  const sel = document.getElementById('table-select');
  if (!sel) return;
  const snap = await getDocs(query(branchCol('tables'), where('isActive','==',true)));
  snap.docs.forEach(d => {
    const data = d.data();
    const opt = document.createElement('option');
    opt.value = d.id;
    opt.textContent = `طاولة ${data.number||d.id} (${statusLabel(data.status)})`;
    if (d.id === posTableId) opt.selected = true;
    sel.appendChild(opt);
  });
}

window.selectTable = (id, text) => {
  posTableId = id || null;
  posTableNum = text ? text.match(/\d+/)?.[0] : null;
};

async function validateOrder() {
  if (cart.length === 0) { toast('السلة فارغة', 'error'); return false; }
  if (posOrderType === 'dine-in' && !posTableId) { toast('اختر طاولة أولًا', 'error'); return false; }
  return true;
}

async function buildOrderData(status = 'pending') {
  const user = auth.currentUser;
  const items = cart.map(i => ({ ...i, lineTotal: n(i.unitPrice) * i.quantity }));
  return {
    tenantId: TENANT, branchId: BRANCH, source: 'cashier',
    customerId: user?.uid || 'cashier',
    orderType: posOrderType,
    tableId: posTableId || null,
    tableNumber: posTableNum ? +posTableNum : null,
    items, subtotal: cartSubtotal(), discount: n(posDiscount),
    totalAmount: cartTotal(), total: cartTotal(),
    status, paymentStatus: 'unpaid', isPaid: false,
    notes: posNotes, createdBy: user?.email,
    createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
    orderNumber: ordNum()
  };
}

window.sendToKitchen = async () => {
  if (!await validateOrder()) return;
  try {
    const data = await buildOrderData('pending');
    const ref = await addDoc(ordersCol(), data);
    if (posTableId) {
      await setDoc(doc(branchCol('tables'), posTableId), {status:'occupied', activeOrderId:ref.id, isOccupied:true, lastStatusUpdate:serverTimestamp()}, {merge:true});
    }
    await logAction('create_order', {orderId:ref.id, total:cartTotal(), orderNumber:data.orderNumber});
    toast('تم إرسال الطلب للمطبخ ✓', 'success');
    cart.length = 0; posDiscount = 0; posNotes = ''; posTableId = null; posTableNum = null;
    renderTicket();
  } catch(e) { toast('خطأ في إرسال الطلب: ' + e.message, 'error'); }
};

window.processPayment = async (method) => {
  if (!await validateOrder()) return;
  if (method === 'mixed') {
    const cashAmt = parseFloat(prompt('أدخل المبلغ كاش:') || '0');
    const cardAmt = cartTotal() - cashAmt;
    if (cashAmt < 0 || cashAmt > cartTotal()) return toast('مبلغ الكاش غير صحيح', 'error');
    return finishPayment('mixed', cartTotal(), cashAmt, cardAmt);
  }
  return finishPayment(method, cartTotal());
};

async function finishPayment(method, total, cashPart=0, cardPart=0) {
  try {
    const data = await buildOrderData('paid');
    data.status = 'paid'; data.isPaid = true; data.paymentStatus = 'paid';
    data.paymentMethod = method; data.paidAt = serverTimestamp();
    if (method==='mixed') { data.cashAmount = cashPart; data.cardAmount = cardPart; }
    const ref = await addDoc(ordersCol(), data);
    await addDoc(collection(db,'payments'), { orderId:ref.id, paymentMethod:method, amount:total, cashPart:cashPart||null, cardPart:cardPart||null, tenantId:TENANT, paidAt:serverTimestamp() });
    if (posTableId) {
      await setDoc(doc(branchCol('tables'), posTableId), {status:'available', activeOrderId:null, isOccupied:false, lastStatusUpdate:serverTimestamp()}, {merge:true});
    }
    await logAction('process_payment', { orderId:ref.id, method, total });
    toast(`تم الدفع بنجاح ✓ (${money(total)})`, 'success');
    cart.length = 0; posDiscount = 0; posNotes = ''; posTableId = null; posTableNum = null;
    renderTicket();
  } catch(e) { toast('خطأ في عملية الدفع: ' + e.message, 'error'); }
}

window.setOrderStatus = async (id, status, tableId) => {
  const tableStatus = { preparing:'occupied', ready:'orderReady', paid:'available', cancelled:'available' }[status] || 'occupied';
  const batch = writeBatch(db);
  batch.update(doc(ordersCol(), id), {status, updatedAt:serverTimestamp()});
  if (tableId) batch.set(doc(branchCol('tables'), tableId), {status:tableStatus, lastStatusUpdate:serverTimestamp()}, {merge:true});
  await batch.commit();
  toast('تم تحديث حالة الطلب', 'success');
};

window.payOrder = async (id, method, tableId, total) => {
  const batch = writeBatch(db);
  batch.update(doc(ordersCol(), id), {status:'paid', isPaid:true, paymentMethod:method, paymentStatus:'paid', paidAt:serverTimestamp(), updatedAt:serverTimestamp()});
  if (tableId) batch.set(doc(branchCol('tables'), tableId), {status:'available', activeOrderId:null, isOccupied:false, lastStatusUpdate:serverTimestamp()}, {merge:true});
  await batch.commit();
  await addDoc(collection(db,'payments'), {orderId:id, paymentMethod:method, amount:n(total), tenantId:TENANT, paidAt:serverTimestamp()});
  await logAction('payment', {orderId:id, method, amount:n(total)});
  toast(`تم الدفع ✓`, 'success');
};

window.cancelOrder = async (id, tableId) => {
  const reason = prompt('سبب الإلغاء:');
  if (reason === null) return;
  const batch = writeBatch(db);
  batch.update(doc(ordersCol(), id), {status:'cancelled', cancelReason:reason, updatedAt:serverTimestamp()});
  if (tableId) batch.set(doc(branchCol('tables'), tableId), {status:'available', lastStatusUpdate:serverTimestamp()}, {merge:true});
  await batch.commit();
  await logAction('cancel_order', {orderId:id, reason});
  toast('تم إلغاء الطلب', 'info');
};

async function loadShiftContent() {
  const div = document.getElementById('shift-content');
  if (!div) return;
  const snap = await getDocs(query(col('cash_sessions'), where('status','==','open'), limit(1)));
  const openSession = snap.docs[0];
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const [ordersSnap, expSnap] = await Promise.all([
    getDocs(query(ordersCol(), where('tenantId','==',TENANT), where('createdAt','>=',Timestamp.fromDate(todayStart)))),
    getDocs(query(col('expenses'), where('createdAt','>=',Timestamp.fromDate(todayStart))))
  ]);
  const orders = ordersSnap.docs.map(d=>d.data());
  const paid = orders.filter(o=>o.status==='paid'||o.isPaid===true);
  const cashSales = paid.filter(o=>(o.paymentMethod||'').includes('cash')).reduce((s,o)=>s+n(o.totalAmount),0);
  const cardSales = paid.filter(o=>(o.paymentMethod||'').includes('card')).reduce((s,o)=>s+n(o.totalAmount),0);
  const expTotal = expSnap.docs.reduce((s,d)=>s+n(d.data().amount),0);
  const openBal = openSession ? n(openSession.data().openingBalance) : 0;
  const expectedCash = openBal + cashSales - expTotal;

  if (openSession) {
    div.innerHTML = `
      <div class="shift-card">
        <div class="shift-status open">🟢 الوردية مفتوحة</div>
        <div class="shift-stats">
          <div class="shift-stat"><label>رصيد البداية</label><span>${money(openBal)}</span></div>
          <div class="shift-stat"><label>مبيعات الكاش</label><span class="text-success">${money(cashSales)}</span></div>
          <div class="shift-stat"><label>مبيعات البطاقة</label><span class="text-info">${money(cardSales)}</span></div>
          <div class="shift-stat"><label>المصاريف</label><span class="text-danger">${money(expTotal)}</span></div>
          <div class="shift-stat"><label>الكاش المتوقع</label><span>${money(expectedCash)}</span></div>
        </div>
        <div class="form-group">
          <label>المبلغ الفعلي في الصندوق</label>
          <input class="form-control" type="number" id="actual-cash" placeholder="0.00" />
        </div>
        <button class="btn btn-danger btn-lg btn-block" onclick="closeShift('${openSession.id}',${openBal},${cashSales},${cardSales},${expTotal})">إغلاق الوردية</button>
      </div>`;
  } else {
    div.innerHTML = `
      <div class="shift-card">
        <div class="shift-status closed">⚫ لا توجد وردية مفتوحة</div>
        <div class="form-group">
          <label>رصيد البداية (الكاش في الصندوق)</label>
          <input class="form-control" type="number" id="opening-balance" placeholder="0.00" value="0" />
        </div>
        <button class="btn btn-primary btn-lg btn-block" onclick="openShift()">فتح وردية جديدة</button>
      </div>`;
  }
}

  const bal = parseFloat(document.getElementById('opening-balance').value)||0;
  const id = 'shift_'+uid();
  await setDoc(doc(col('cash_sessions'),id), {
    id, userId:auth.currentUser?.uid, userEmail:auth.currentUser?.email,
    openingBalance:bal, status:'open', openedAt:serverTimestamp(), tenantId:TENANT
  });
  await logAction('open_shift', {openingBalance:bal});
  toast('تم فتح الوردية ✓', 'success');
  loadShiftContent();
};

window.closeShift = async (id, openBal, cashSales, cardSales, expTotal) => {
  const actualCash = parseFloat(document.getElementById('actual-cash').value);
  if (isNaN(actualCash)) return toast('أدخل المبلغ الفعلي', 'error');
  const expectedCash = openBal + cashSales - expTotal;
  const diff = actualCash - expectedCash;
  await setDoc(doc(col('cash_sessions'),id), {
    cashSales, cardSales, expensesTotal:expTotal,
    expectedCash, actualCash, difference:diff, status:'closed', closedAt:serverTimestamp()
  }, {merge:true});
  await logAction('close_shift', {id, expectedCash, actualCash, difference:diff});
  toast(`تم إغلاق الوردية. الفرق: ${money(diff)}`, diff===0?'success':diff>0?'info':'warning');
  loadShiftContent();
};

// ─── REPORTS ────────────────────────────────────────────────────────────────
function renderReports() {
  const main = document.getElementById('main-content');
  const today = new Date().toISOString().split('T')[0];
  main.innerHTML = `
    <div class="page-inner">
      <div class="report-filters">
        <div class="form-group">
          <label>من تاريخ</label>
          <input class="form-control" type="date" id="rep-from" value="${today}" />
        </div>
        <div class="form-group">
          <label>إلى تاريخ</label>
          <input class="form-control" type="date" id="rep-to" value="${today}" />
        </div>
        <button class="btn btn-primary" onclick="loadReports()">🔍 عرض التقرير</button>
      </div>
      <div id="report-content"></div>
    </div>`;
  loadReports();
}

window.loadReports = async () => {
  const fromStr = document.getElementById('rep-from').value;
  const toStr = document.getElementById('rep-to').value;
  if (!fromStr || !toStr) return toast('اختر نطاق التاريخ', 'error');
  const from = new Date(fromStr + 'T00:00:00');
  const to = new Date(toStr + 'T23:59:59');
  const div = document.getElementById('report-content');
  div.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';

  const [ordersSnap, expSnap] = await Promise.all([
    getDocs(query(ordersCol(), where('tenantId','==',TENANT), where('createdAt','>=',Timestamp.fromDate(from)), where('createdAt','<=',Timestamp.fromDate(to)), orderBy('createdAt','desc'))),
    getDocs(query(col('expenses'), where('createdAt','>=',Timestamp.fromDate(from)), where('createdAt','<=',Timestamp.fromDate(to))))
  ]);

  const orders = ordersSnap.docs.map(d=>d.data());
  const expenses = expSnap.docs.map(d=>d.data());
  const paid = orders.filter(o=>o.status==='paid'||o.isPaid===true);
  const cancelled = orders.filter(o=>o.status==='cancelled');
  const totalSales = paid.reduce((s,o)=>s+n(o.totalAmount||o.total),0);
  const cashSales = paid.filter(o=>(o.paymentMethod||'').includes('cash')).reduce((s,o)=>s+n(o.totalAmount),0);
  const cardSales = paid.filter(o=>(o.paymentMethod||'').includes('card')).reduce((s,o)=>s+n(o.totalAmount),0);
  const totalDiscounts = paid.reduce((s,o)=>s+n(o.discount),0);
  const totalExpenses = expenses.reduce((s,e)=>s+n(e.amount),0);
  const netCash = cashSales - totalExpenses;

  // top products
  const itemCount = {};
  paid.forEach(o => (o.items||[]).forEach(it => { itemCount[it.productName] = (itemCount[it.productName]||0) + n(it.quantity); }));
  const topProducts = Object.entries(itemCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  div.innerHTML = `
    <div class="report-summary">
      <div class="report-stat-card"><span class="rep-label">إجمالي المبيعات</span><span class="rep-value text-success">${money(totalSales)}</span></div>
      <div class="report-stat-card"><span class="rep-label">مبيعات الكاش</span><span class="rep-value">${money(cashSales)}</span></div>
      <div class="report-stat-card"><span class="rep-label">مبيعات البطاقة</span><span class="rep-value">${money(cardSales)}</span></div>
      <div class="report-stat-card"><span class="rep-label">المصاريف</span><span class="rep-value text-danger">${money(totalExpenses)}</span></div>
      <div class="report-stat-card"><span class="rep-label">الخصومات</span><span class="rep-value text-warning">${money(totalDiscounts)}</span></div>
      <div class="report-stat-card"><span class="rep-label">صافي الصندوق</span><span class="rep-value text-info">${money(netCash)}</span></div>
      <div class="report-stat-card"><span class="rep-label">عدد الطلبات</span><span class="rep-value">${orders.length}</span></div>
      <div class="report-stat-card"><span class="rep-label">الطلبات المدفوعة</span><span class="rep-value">${paid.length}</span></div>
      <div class="report-stat-card"><span class="rep-label">الطلبات الملغاة</span><span class="rep-value text-danger">${cancelled.length}</span></div>
    </div>
    ${topProducts.length ? `
    <div class="report-section">
      <h3>🏆 أكثر المنتجات مبيعًا</h3>
      <table class="data-table">
        <thead><tr><th>#</th><th>المنتج</th><th>الكمية</th></tr></thead>
        <tbody>${topProducts.map(([name,qty],i)=>`<tr><td>${i+1}</td><td>${name}</td><td>${qty}</td></tr>`).join('')}</tbody>
      </table>
    </div>` : ''}
    ${expenses.length ? `
    <div class="report-section">
      <h3>💸 المصاريف</h3>
      <table class="data-table">
        <thead><tr><th>التاريخ</th><th>النوع</th><th>المبلغ</th></tr></thead>
        <tbody>${expenses.map(e=>`<tr><td>${ts2str(e.createdAt)}</td><td>${e.category||e.title}</td><td>${money(e.amount)}</td></tr>`).join('')}</tbody>
      </table>
    </div>` : ''}`;
};

// ─── SETTINGS ────────────────────────────────────────────────────────────────
function renderSettings() {
  const main = document.getElementById('main-content');
  main.innerHTML = `<div class="page-inner"><div id="settings-form"><div class="loading-spinner"><div class="spinner"></div></div></div></div>`;
  loadSettings();
}

async function loadSettings() {
  const div = document.getElementById('settings-form');
  if (!div) return;
  const snap = await getDoc(tenantRef());
  const data = snap.data() || {};
  div.innerHTML = `
    <div class="settings-card">
      <h3>معلومات المطعم</h3>
      <div class="form-group"><label>اسم المطعم</label><input class="form-control" id="s-name" value="${data.name||''}" /></div>
      <div class="form-group"><label>رقم الهاتف</label><input class="form-control" id="s-phone" value="${data.phone||''}" /></div>
      <div class="form-group"><label>العنوان</label><input class="form-control" id="s-address" value="${data.address||''}" /></div>
    </div>
    <div class="settings-card">
      <h3>إعدادات النظام</h3>
      <div class="form-group"><label>العملة</label>
        <select class="form-control" id="s-currency">
          <option value="TRY" ${data.currency==='TRY'?'selected':''}>TRY — ليرة تركية (₺)</option>
          <option value="SAR" ${data.currency==='SAR'?'selected':''}>SAR — ريال سعودي (﷼)</option>
          <option value="USD" ${data.currency==='USD'?'selected':''}>USD — دولار ($)</option>
          <option value="EUR" ${data.currency==='EUR'?'selected':''}>EUR — يورو (€)</option>
        </select>
      </div>
      <div class="form-group"><label>نسبة الضريبة (%)</label><input class="form-control" type="number" id="s-tax" value="${data.taxRate||0}" min="0" max="100" /></div>
    </div>
    <button class="btn btn-primary btn-lg" onclick="saveSettings()">💾 حفظ الإعدادات</button>`;
}

window.saveSettings = async () => {
  await setDoc(tenantRef(), {
    name: document.getElementById('s-name').value.trim(),
    phone: document.getElementById('s-phone').value.trim(),
    address: document.getElementById('s-address').value.trim(),
    currency: document.getElementById('s-currency').value,
    taxRate: parseFloat(document.getElementById('s-tax').value)||0,
    updatedAt: serverTimestamp()
  }, {merge:true});
  await logAction('update_settings');
  toast('تم حفظ الإعدادات ✓', 'success');
};

// ─── LOGS ────────────────────────────────────────────────────────────────
function renderLogs() {
  const main = document.getElementById('main-content');
  main.innerHTML = `<div class="page-inner"><div id="logs-table"></div></div>`;

  const unsub = onSnapshot(query(col('activity_logs'), orderBy('createdAt','desc'), limit(200)), snap => {
    const div = document.getElementById('logs-table');
    if (!div) return;
    const logs = snap.docs.map(d=>d.data());
    if (!logs.length) { div.innerHTML='<p class="empty-state">لا توجد سجلات</p>'; return; }
    div.innerHTML = `<table class="data-table">
      <thead><tr><th>التاريخ والوقت</th><th>المستخدم</th><th>العملية</th><th>التفاصيل</th></tr></thead>
      <tbody>${logs.map(l=>`
        <tr>
          <td>${ts2str(l.createdAt)}</td>
          <td>${l.userEmail||l.userId||'—'}</td>
          <td><span class="log-action">${actionLabel(l.action)}</span></td>
          <td><small class="text-muted">${JSON.stringify(l.details||{}).slice(0,80)}</small></td>
        </tr>`).join('')}
      </tbody></table>`;
  });
  unsubListeners.push(unsub);
}

// ─── Simple Collection (generic CRUD) ────────────────────────────────────
function renderSimpleCollection(collectionName, title, fields, displayFields) {
  const main = document.getElementById('main-content');
  const modalId = `sc-modal-${collectionName}`;
  const tableId = `sc-table-${collectionName}`;
  main.innerHTML = `
    <div class="page-inner">
      <div class="page-toolbar">
        <button class="btn btn-primary" onclick="showScModal('${collectionName}')">+ إضافة</button>
      </div>
      <div id="${tableId}"></div>
    </div>
    <div id="${modalId}" class="modal" style="display:none">
      <div class="modal-overlay" onclick="closeModal('${modalId}')"></div>
      <div class="modal-box">
        <div class="modal-header"><h3 id="${modalId}-title">إضافة ${title}</h3><button class="modal-close" onclick="closeModal('${modalId}')">✕</button></div>
        <div class="modal-body">
          <input type="hidden" id="${modalId}-id" />
          ${fields.map(f=>`<div class="form-group"><label>${f.label}</label><input class="form-control" id="${modalId}-${f.id}" type="${f.type||'text'}" placeholder="${f.label}" /></div>`).join('')}
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="closeModal('${modalId}')">إلغاء</button>
          <button class="btn btn-primary" onclick="saveScItem('${collectionName}','${modalId}',${JSON.stringify(fields)})">حفظ</button>
        </div>
      </div>
    </div>`;

  const unsub = onSnapshot(col(collectionName), snap => {
    const div = document.getElementById(tableId);
    if (!div) return;
    const items = snap.docs.map(d=>({...d.data(),id:d.id})).filter(i=>!i.deleted);
    if (!items.length) { div.innerHTML=`<p class="empty-state">لا توجد بيانات في ${title}</p>`; return; }
    div.innerHTML = `<table class="data-table">
      <thead><tr>${displayFields.map(f=>`<th>${fields.find(ff=>ff.id===f)?.label||f}</th>`).join('')}<th>إجراءات</th></tr></thead>
      <tbody>${items.map(item=>`
        <tr>
          ${displayFields.map(f=>`<td>${item[f]||'—'}</td>`).join('')}
          <td class="actions-cell">
            <button class="btn btn-sm btn-ghost" onclick='editScItem("${collectionName}","${modalId}",${JSON.stringify(fields)},${JSON.stringify(item)})'>✏️</button>
            <button class="btn btn-sm btn-danger-ghost" onclick="deleteScItem('${collectionName}','${item.id}')">🗑</button>
          </td>
        </tr>`).join('')}
      </tbody></table>`;
  });
  unsubListeners.push(unsub);
}

window.showScModal = (coll) => {
  const modalId = `sc-modal-${coll}`;
  const modal = document.getElementById(modalId);
  if (!modal) return;
  modal.querySelectorAll('input:not([type=hidden])').forEach(i => i.value = '');
  document.getElementById(`${modalId}-id`).value = '';
  openModal(modalId);
};
window.editScItem = (coll, modalId, fields, item) => {
  document.getElementById(`${modalId}-id`).value = item.id;
  fields.forEach(f => { const el = document.getElementById(`${modalId}-${f.id}`); if (el) el.value = item[f.id]||''; });
  openModal(modalId);
};
window.saveScItem = async (coll, modalId, fields) => {
  const id = document.getElementById(`${modalId}-id`).value;
  const required = fields.filter(f=>f.required);
  const data = {};
  for (const f of fields) { data[f.id] = document.getElementById(`${modalId}-${f.id}`)?.value.trim()||null; }
  for (const f of required) { if (!data[f.id]) return toast(`أدخل ${f.label}`, 'error'); }
  data.tenantId = TENANT; data.updatedAt = serverTimestamp();
  if (id) await setDoc(doc(col(coll),id), data, {merge:true});
  else { const nid=coll+'_'+uid(); data.id=nid; data.createdAt=serverTimestamp(); await setDoc(doc(col(coll),nid), data); }
  toast('تم الحفظ ✓', 'success'); closeModal(modalId);
};
window.deleteScItem = async (coll, id) => {
  if (!await confirm2('حذف هذا العنصر؟')) return;
  await setDoc(doc(col(coll),id), {deleted:true, updatedAt:serverTimestamp()}, {merge:true});
  toast('تم الحذف', 'info');
};

// ── Utility Labels ───────────────────────────────────────────────────────
function statusLabel(s) {
  return {available:'متاح 🟢',occupied:'مشغول 🔴',orderReady:'جاهز 🟡',suspended:'موقوف ⚫',cancelled:'ملغي',pending:'معلق',preparing:'قيد التحضير',ready:'جاهز ✅',paid:'مدفوع 💚',refunded:'مسترجع'}[s] || s || '—';
}
function orderTypeLabel(t) {
  return {dineIn:'داخل المطعم','dine-in':'داخل المطعم',takeaway:'سفري',delivery:'توصيل',pickup:'استلام'}[t] || t || '—';
}
function actionLabel(a) {
  return {login:'تسجيل دخول',open_shift:'فتح وردية',close_shift:'إغلاق وردية',create_order:'إنشاء طلب',cancel_order:'إلغاء طلب',process_payment:'دفع',add_product:'إضافة منتج',edit_product:'تعديل منتج',delete_product:'حذف منتج',add_expense:'إضافة مصروف',delete_expense:'حذف مصروف',adjust_inventory:'تعديل مخزون',add_purchase:'شراء',upsert_table:'إضافة/تعديل طاولة',delete_table:'حذف طاولة',update_settings:'تعديل إعدادات',seed_demo_data:'تجهيز بيانات تجريبية',payment:'دفع طلب'}[a] || a;
}

// ── Modal helpers ────────────────────────────────────────────────────────
window.openModal = (id) => { const m = document.getElementById(id); if (m) m.style.display='flex'; };
window.closeModal = (id) => { const m = document.getElementById(id); if (m) m.style.display='none'; };
</script>

/* ── Stats Grid ── */

.stat-blue .stat-value { color: var(--info); }
.stat-green .stat-value { color: var(--success); }
.stat-purple .stat-value { color: var(--purple); }
.stat-red .stat-value { color: var(--error); }
.stat-teal .stat-value { color: var(--teal); }
.stat-orange .stat-value { color: var(--orange); }

/* ── POS Layout ── */
.pos-layout {

}

.products-grid {

}
.product-card {

}
.product-card:hover { background: var(--surface); border-color: var(--amber); transform: translateY(-1px); }
.product-card:active { transform: translateY(0); }
.product-icon { font-size: 28px; }
.product-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; }
.product-price { font-size: 13px; color: var(--amber); font-weight: 700; }

/* ── Ticket ── */
.pos-ticket {
  width: 360px; min-width: 360px; background: var(--bg2);

}
.ticket-header {

}
.ticket-title { font-size: 15px; font-weight: 700; color: var(--text); }
.order-types { display: flex; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.order-type-btn {
  flex: 1; min-width: 0; padding: 7px 4px; font-size: 12px; border-radius: var(--radius-sm);
  background: var(--surface); border: 1px solid var(--border); color: var(--text2);
  cursor: pointer; font-family: inherit; transition: all var(--transition); text-align: center;
}
.order-type-btn.active { background: var(--amber-dim); color: var(--amber); border-color: rgba(245,158,11,0.4); font-weight: 600; }

.qty-btn {

  transition: background var(--transition); font-family: inherit;
}
.qty-btn:hover { background: var(--surface2); }
.qty-btn.btn-danger-ghost { color: var(--error); }
.qty-val { font-size: 14px; font-weight: 700; min-width: 20px; text-align: center; }
.ticket-fields { padding: 8px 16px; display: flex; flex-direction: column; gap: 8px; }
.ticket-totals { padding: 12px 16px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.total-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; color: var(--text2); }
.total-final { font-size: 18px; font-weight: 700; color: var(--text); margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--border); }
.ticket-actions { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.pay-btns { display: flex; gap: 6px; }
.pay-btns .btn { flex: 1; font-size: 12px; padding: 8px 4px; }

/* ── Tables Grid ── */
.tables-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.table-card {
  background: var(--bg2); border: 2px solid var(--border);
  border-radius: var(--radius); padding: 16px;
  transition: border-color var(--transition);
}
.table-card.status-available { border-color: rgba(16,185,129,0.3); }
.table-card.status-occupied { border-color: rgba(239,68,68,0.3); }
.table-card.status-orderReady { border-color: rgba(245,158,11,0.5); }
.table-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.table-number { font-size: 18px; font-weight: 700; }
.table-status-badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: var(--surface); }
.table-qr-url { font-size: 10px; color: var(--text3); word-break: break-all; margin-bottom: 10px; font-family: 'IBM Plex Mono', monospace; }
.table-actions { display: flex; gap: 4px; flex-wrap: wrap; }
.table-actions .btn { padding: 4px 8px; font-size: 11px; }

/* ── Orders ── */
.order-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
.order-card-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.order-number { font-weight: 700; font-size: 14px; }

.order-time { color: var(--text3); font-size: 11px; margin-right: auto; }
.order-total-badge { font-weight: 700; color: var(--amber); font-size: 14px; }
.order-items-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.order-item-chip { background: var(--surface); padding: 3px 10px; border-radius: 20px; font-size: 12px; color: var(--text2); }
.order-note { font-size: 11px; color: var(--warning); }
.order-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* ── Status Badges ── */
.status-badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.status-pending { background: var(--warning-dim); color: var(--warning); }
.status-preparing { background: var(--orange-dim); color: var(--orange); }
.status-ready { background: var(--info-dim); color: var(--info); }
.status-paid { background: var(--success-dim); color: var(--success); }
.status-cancelled { background: var(--error-dim); color: var(--error); }
.status-dot { font-size: 12px; }
.status-dot.active { color: var(--success); }
.status-dot.inactive { color: var(--error); }
.status-dot.warning { color: var(--warning); }

/* ── Kitchen ── */
.kitchen-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.kitchen-header h2 { font-size: 18px; }

.kitchen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.kitchen-empty { font-size: 20px; color: var(--text2); grid-column: 1/-1; text-align: center; padding: 60px; }
.kitchen-ticket {

.kitchen-ticket-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.kitchen-order-num { font-size: 20px; font-weight: 700; color: var(--amber); }
.kitchen-table { background: var(--info-dim); color: var(--info); padding: 3px 10px; border-radius: 20px; font-size: 12px; }
.kitchen-type { background: var(--surface); color: var(--text2); padding: 3px 10px; border-radius: 20px; font-size: 12px; }
.kitchen-time { color: var(--text3); font-size: 11px; margin-right: auto; }
.kitchen-items { margin-bottom: 10px; }
.kitchen-item { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--border); }
.kitchen-qty { font-size: 18px; font-weight: 700; color: var(--amber); min-width: 30px; }
.kitchen-item-name { font-size: 15px; font-weight: 600; }
.kitchen-item-note { font-size: 12px; color: var(--warning); }
.kitchen-order-note { background: var(--warning-dim); color: var(--warning); padding: 6px 10px; border-radius: var(--radius-sm); font-size: 12px; margin-bottom: 10px; }
.kitchen-btns { margin-top: 10px; }

/* ── Data Table ── */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { background: var(--surface); color: var(--text2); font-size: 12px; font-weight: 600; padding: 10px 14px; text-align: right; border-bottom: 1px solid var(--border); }
.data-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
.data-table tr:hover td { background: var(--surface); }
.data-table tr:last-child td { border-bottom: none; }
.row-warning td { background: rgba(245,158,11,0.04) !important; }
.row-inactive td { opacity: 0.6; }
.actions-cell { display: flex; gap: 4px; }
small { color: var(--text3); }

/* ── Modals ── */
.modal { position: fixed; inset: 0; z-index: 500; display: none; align-items: center; justify-content: center; }
.modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); cursor: pointer; }
.modal-box {
  position: relative; z-index: 1; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 16px; width: 100%; max-width: 480px; max-height: 90vh;
  overflow-y: auto; box-shadow: 0 32px 80px rgba(0,0,0,0.5);
}
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 14px; border-bottom: 1px solid var(--border); }
.modal-header h3 { font-size: 16px; font-weight: 700; }
.modal-close { background: transparent; border: none; color: var(--text2); font-size: 18px; cursor: pointer; padding: 4px; }
.modal-body { padding: 20px; }
.modal-footer { padding: 14px 20px 18px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--border); }

/* ── Confirm Modal ── */
#confirm-modal { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; }
.confirm-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 28px 28px 20px; max-width: 360px; width: 100%; text-align: center; }
#confirm-msg { margin-bottom: 20px; font-size: 15px; line-height: 1.5; }
.confirm-btns { display: flex; gap: 10px; justify-content: center; }
.confirm-btns .btn { min-width: 90px; }

/* ── Toast ── */
#toast-container { position: fixed; top: 20px; left: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--bg2); border: 1px solid var(--border);

  opacity: 0; transform: translateX(-20px);
  transition: all 0.3s ease; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(0); pointer-events: auto; }
.toast-success { border-color: rgba(16,185,129,0.5); color: var(--success); }
.toast-error { border-color: rgba(239,68,68,0.5); color: var(--error); }
.toast-warning { border-color: rgba(245,158,11,0.5); color: var(--warning); }
.toast-info { border-color: rgba(59,130,246,0.5); color: var(--info); }

/* ── Alerts ── */
.alert { padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 13px; }
.alert-warning { background: var(--warning-dim); color: var(--warning); border: 1px solid rgba(245,158,11,0.3); }

/* ── Loading ── */
.loading-spinner { display: flex; align-items: center; justify-content: center; padding: 60px; }

/* ── Empty State ── */

/* ── Reports ── */
.report-filters { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
.report-summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }

.shift-stat { background: var(--surface); border-radius: var(--radius-sm); padding: 12px 14px; }
.shift-stat label { font-size: 11px; color: var(--text3); display: block; margin-bottom: 4px; }
.shift-stat span { font-size: 16px; font-weight: 700; }

/* ── Settings ── */
.settings-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 16px; max-width: 600px; }
.settings-card h3 { font-size: 14px; color: var(--text2); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }

/* ── Log Action Badge ── */
.log-action { background: var(--surface); padding: 2px 8px; border-radius: 4px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; color: var(--amber); }

/* ── Colors ── */
.text-success { color: var(--success) !important; }
.text-danger, .text-error { color: var(--error) !important; }
.text-info { color: var(--info) !important; }
.text-warning { color: var(--warning) !important; }
.text-muted { color: var(--text3) !important; }
.text-amber { color: var(--amber) !important; }

/* ── Low stock ── */
.low-stock-section { margin-top: 20px; }

/* ── Kitchen bg overflow ── */
.kitchen-grid, .tables-grid { overflow-x: hidden; }

/* ── Responsive ── */
@media (max-width: 900px) {
  :root { --sidebar-w: 56px; }
  .sidebar-title, .sidebar-subtitle, .nav-item span:not(.nav-icon) { display: none; }
  .nav-item { justify-content: center; padding: 10px; }
  .pos-ticket { width: 300px; min-width: 300px; }
  .pos-categories { width: 56px; min-width: 56px; }
  .cat-header, .cat-btn span { display: none; }

}

  .pos-ticket { width: 100%; min-width: 100%; height: 50vh; }

  .cat-btn { white-space: nowrap; width: auto; flex-shrink: 0; }
}
